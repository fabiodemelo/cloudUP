[package]
name = "cloudup"
version = "1.2.0"
description = "CloudUp - mount cloud storage (S3, WebDAV and more) as a local drive"
authors = ["CloudUp"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cloudup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
keyring = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "2"
dirs = "5"
roxmltree = "0.20"
libc = "0.2"
ssh2 = { version = "0.9", default-features = false, features = ["vendored-openssl"] }

dav-server = { version = "0.11", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
futures-util = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = ["compat"] }
# MEGA API client (MIT OR Apache-2.0), vendored with small fixes: see
# vendor/mega/Cargo.toml.
mega = { path = "vendor/mega" }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSArray", "NSGeometry", "NSOperation", "NSObject", "NSAttributedString", "NSData", "NSDictionary", "NSFileManager", "NSAppleEventManager", "NSAppleEventDescriptor"] }
objc2-app-kit = { version = "0.3", features = ["block2", "NSFilePromiseProvider", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSView", "NSWindow", "NSApplication", "NSEvent", "NSResponder", "NSImage", "NSWorkspace", "NSAttributedString", "objc2-uniform-type-identifiers"] }
objc2-file-provider = "0.3"
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[features]
default = ["updater"]
# In-app updates through the Tauri updater (direct download build only).
updater = ["dep:tauri-plugin-updater"]
# Mac App Store build: no self-updater (App Review 2.4.5). Build with
# --no-default-features --features mas (scripts/release-appstore.sh).
mas = []

[profile.release]
codegen-units = 1
lto = true
strip = true
