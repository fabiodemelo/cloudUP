[package]
name = "cloudup"
version = "1.0.0"
description = "CloudUp - mount cloud storage (S3, WebDAV and more) as a local drive"
authors = ["CloudUp"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cloudup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
keyring = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "2"
dirs = "5"
open = "5"
roxmltree = "0.20"
libc = "0.2"
ssh2 = { version = "0.9", default-features = false, features = ["vendored-openssl"] }

# Optional: mount the connection as a real drive (needs macFUSE on macOS / WinFsp on Windows)
fuser = { version = "0.15", optional = true }

[features]
default = []
fuse-mount = ["dep:fuser"]

[profile.release]
codegen-units = 1
lto = true
strip = true
